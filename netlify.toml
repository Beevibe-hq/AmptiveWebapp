[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirects live in dist/_redirects, generated per-deploy by
# scripts/generate-redirects.mjs. They must differ between staging and production (API
# target, tip-domain hostnames) and Netlify's docs are explicit that netlify.toml
# redirects are global and cannot be scoped to a deploy context.

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://accounts.google.com https://*.google.com https://*.googleapis.com https://fonts.gstatic.com https://amptive-staging.getamptive.com https://api.getamptive.com https://*.onrender.com https://*.supabase.co https://api.tomtom.com https://maps.googleapis.com https://places.googleapis.com https://api.mapbox.com http://localhost:*; media-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob: https://accounts.google.com; frame-src 'self' blob: https://accounts.google.com https://*.google.com https://maps.google.com https://*.facebook.com https://*.supabase.co; form-action 'self' https://accounts.google.com https://*.supabase.co;"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Allow CORS for backend API
[[headers]]
  for = "/auth/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

