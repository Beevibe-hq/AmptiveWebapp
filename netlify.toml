[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# API proxy to Render backend (Must be BEFORE catch-all)
[[redirects]]
  from = "/api/*"
  to = "https://amptive-staging.getamptive.com/api/:splat"
  status = 200
  force = true

# Dynamic SEO rewrite rules
[[redirects]]
  from = "/events/:id"
  to = "/.netlify/functions/seo-renderer"
  status = 200
  force = true

[[redirects]]
  from = "/blog/:id"
  to = "/.netlify/functions/seo-renderer"
  status = 200
  force = true

[[redirects]]
  from = "/support/:id"
  to = "/.netlify/functions/seo-renderer"
  status = 200
  force = true

# Redirect all client-side routes to index.html (MUST BE LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://accounts.google.com https://*.google.com https://*.googleapis.com https://amptive-staging.getamptive.com https://*.onrender.com https://*.supabase.co https://api.tomtom.com https://maps.googleapis.com https://places.googleapis.com https://api.mapbox.com http://localhost:*; media-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob: https://accounts.google.com; frame-src 'self' blob: https://accounts.google.com https://*.google.com https://maps.google.com https://*.facebook.com https://*.supabase.co; form-action 'self' https://accounts.google.com https://*.supabase.co;"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Allow CORS for backend API
[[headers]]
  for = "/auth/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

