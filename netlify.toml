[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  included_files = ["netlify/functions/fonts/**"]

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Dynamic SEO rewrite rules
[[redirects]]
  from = "/events/:id"
  to = "/.netlify/functions/seo-renderer"
  status = 200
  force = true

[[redirects]]
  from = "/blog/:id"
  to = "/.netlify/functions/seo-renderer"
  status = 200
  force = true

[[redirects]]
  from = "/support/:id"
  to = "/.netlify/functions/seo-renderer"
  status = 200
  force = true

# Let Netlify functions pass through — must be BEFORE the catch-all /*
[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200
  force = true

# Redirect all requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://amptive-staging.getamptive.com/api/:splat"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allow blob: for image crop previews, workers; allow data: for inline images; expand connect-src to backend and Supabase
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://amptive-staging.getamptive.com https://*.onrender.com https://api.tomtom.com http://localhost:*; media-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://*.supabase.co https://maps.google.com https://*.google.com; form-action 'self' https://*.supabase.co;"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Allow CORS for backend API
[[headers]]
  for = "/auth/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://amptive-staging.getamptive.com https://*.onrender.com http://localhost:* https://*.supabase.co; img-src 'self' data: blob: https:; media-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:;"
